# ABRP-telemetrie - voorbeeld voor je eigen secrets.yaml
#
# DIT BESTAND NIET IN /config/packages/ ZETTEN. Het is geen package: kopieer
# alleen het blok `abrp_kia_niro_telemetry_url:` hieronder naar je eigen
# /config/secrets.yaml en vervang JOUW_API_KEY en JOUW_TOKEN.
#
#   api_key : hoort bij een APPLICATIE - ABRP-ontwikkelaarsportaal
#   token   : hoort bij je VOERTUIG - in de ABRP-app bij de live-data-instellingen
# Twee verschillende dingen. Deel geen van beide, en plak ze nooit in een
# chat of forum: een URL wordt daar vaak automatisch een link, en die link
# bevat dan de volledige waarde, ook als de zichtbare tekst ingekort is.
#
# Entiteiten die dit gebruikt (allemaal uit dit pakket, vaste entity-ID's):
#   uit eniro-mqtt.yaml:
#     sensor.e_niro_soc, sensor.e_niro_accuvermogen, sensor.e_niro_accuspanning,
#     sensor.e_niro_accutemperatuur, sensor.e_niro_kilometerstand,
#     binary_sensor.e_niro_laadt, binary_sensor.e_niro_snelladen,
#     device_tracker.e_niro_locatie
#   uit eniro-autopi.yaml:
#     input_number.e_niro_bruikbare_capaciteit
# Controleer ze na de installatie in Instellingen > Entiteiten. Heet er een
# toch anders (bijvoorbeeld met `_2` erachter, omdat de naam al bestond),
# dan stuurt | float(0) zonder foutmelding een 0 naar ABRP. Pas de ID dan
# hieronder aan.
#
# Kilometerstand: gaat alleen mee als de sensor een getal heeft (hij vult zich
# bij de eerste rit met contact aan). Anders zou ABRP een stand van 0 krijgen.
#
# Positie: lat/lon gaan alleen mee als de dongle een GPS-positie heeft
# gepubliceerd. Zonder positie laat de template ze weg, in plaats van 0,0
# te sturen. (Heb je een tweede bron voor de positie, bijvoorbeeld de
# tracker van de fabrieksapp, dan kun je die als terugval toevoegen: vul
# dlat/dlon aan met `or state_attr('device_tracker.JOUW_TRACKER', 'latitude')`.)

abrp_kia_niro_telemetry_url: >
  {% set cap = states('input_number.e_niro_bruikbare_capaciteit') | float(70) %}
  {% set soc = states('sensor.e_niro_soc') | float(0) %}
  {% set dlat = state_attr('device_tracker.e_niro_locatie', 'latitude') %}
  {% set dlon = state_attr('device_tracker.e_niro_locatie', 'longitude') %}
  {% set km = states('sensor.e_niro_kilometerstand') %}
  {% set tlm = {
    "utc": now().timestamp() | int,
    "soc": soc,
    "soe": (soc / 100 * cap) | round(2),
    "power": (states('sensor.e_niro_accuvermogen') | float(0)) * -1,
    "voltage": states('sensor.e_niro_accuspanning') | float(0),
    "batt_temp": states('sensor.e_niro_accutemperatuur') | float(0),
    "is_charging": is_state('binary_sensor.e_niro_laadt', 'on'),
    "is_dcfc": is_state('binary_sensor.e_niro_snelladen', 'on'),
    "speed": state_attr('device_tracker.e_niro_locatie', 'speed') | default(0, true),
    "elevation": state_attr('device_tracker.e_niro_locatie', 'altitude') | default(0, true),
    "heading": state_attr('device_tracker.e_niro_locatie', 'heading') | default(0, true),
    "capacity": cap
  } %}
  {% if dlat is not none and dlon is not none %}
    {% set tlm = dict(tlm, lat=dlat, lon=dlon) %}
  {% endif %}
  {% if is_number(km) %}
    {% set tlm = dict(tlm, odometer=km | float) %}
  {% endif %}
  https://api.iternio.com/1/tlm/send?api_key=JOUW_API_KEY&token=JOUW_TOKEN&tlm={{ tlm | to_json | urlencode }}
